<svg width="1600" height="1320" viewBox="0 0 1600 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8FA4B6" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#5E768B"/>
    </marker>
    <style>
      .title { font: 700 38px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #17324A; }
      .subtitle { font: 400 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #587085; }
      .section-tag { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #FFFFFF; }
      .box-title { font: 700 24px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #17324A; }
      .box-sub { font: 500 17px "Consolas", "SFMono-Regular", monospace; fill: #5A7387; }
      .note { font: 400 17px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #5D7488; }
      .small { font: 500 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #496378; }
      .arrow { stroke: #5E768B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1320" fill="url(#bg)"/>

  <text x="80" y="78" class="title">OpenCray 运行时总体架构</text>
  <text x="80" y="114" class="subtitle">程序运行时的主线是“界面入口 → 宿主桥接 → 会话调度 → Agent 执行”，上下文、工具策略和本地持久化作为支撑能力挂接其上。</text>

  <rect x="520" y="160" width="560" height="950" rx="34" fill="#F8FBFE" stroke="#DBE6EE" stroke-width="2"/>
  <rect x="550" y="132" width="142" height="42" rx="21" fill="#2E5F7A"/>
  <text x="621" y="159" text-anchor="middle" class="section-tag">主执行链</text>

  <rect x="640" y="220" width="320" height="78" rx="24" fill="#DCEEFF" filter="url(#shadow)"/>
  <text x="800" y="268" text-anchor="middle" class="box-title">Flutter 界面层</text>

  <rect x="620" y="346" width="360" height="92" rx="24" fill="#E5F4FF" filter="url(#shadow)"/>
  <text x="800" y="394" text-anchor="middle" class="box-title">宿主桥接层</text>
  <text x="800" y="425" text-anchor="middle" class="box-sub">OpenCrayFlutterHostBridge</text>

  <rect x="610" y="486" width="380" height="92" rx="24" fill="#EAF7F3" filter="url(#shadow)"/>
  <text x="800" y="534" text-anchor="middle" class="box-title">宿主运行时</text>
  <text x="800" y="565" text-anchor="middle" class="box-sub">OpenCrayHostRuntime</text>

  <rect x="590" y="626" width="420" height="116" rx="24" fill="#FFF3D8" filter="url(#shadow)"/>
  <text x="800" y="674" text-anchor="middle" class="box-title">会话运行管理</text>
  <text x="800" y="702" text-anchor="middle" class="box-sub">AgentSessionRuntime</text>
  <text x="800" y="728" text-anchor="middle" class="box-sub">Manager</text>

  <rect x="540" y="786" width="520" height="142" rx="24" fill="#FFEEDF" filter="url(#shadow)"/>
  <text x="800" y="834" text-anchor="middle" class="box-title">任务运行时工厂</text>
  <text x="800" y="862" text-anchor="middle" class="box-sub">AppAgentSessionTaskRuntime</text>
  <text x="800" y="888" text-anchor="middle" class="box-sub">Factory</text>
  <text x="800" y="914" text-anchor="middle" class="note">装配 LLM、上下文、工具、权限与持久化依赖</text>

  <rect x="610" y="972" width="380" height="100" rx="24" fill="#F0EEFF" filter="url(#shadow)"/>
  <text x="800" y="1022" text-anchor="middle" class="box-title">Agent 执行引擎</text>
  <text x="800" y="1054" text-anchor="middle" class="box-sub">OpenCrayAgentRuntime</text>

  <path d="M800 298V346" class="arrow"/>
  <path d="M800 438V486" class="arrow"/>
  <path d="M800 578V626" class="arrow"/>
  <path d="M800 742V786" class="arrow"/>
  <path d="M800 928V972" class="arrow"/>

  <rect x="80" y="600" width="360" height="280" rx="30" fill="#F3FAF6" stroke="#D8E9E1" stroke-width="2"/>
  <rect x="110" y="572" width="178" height="42" rx="21" fill="#3F7A62"/>
  <text x="199" y="599" text-anchor="middle" class="section-tag">上下文与模型支撑</text>

  <rect x="110" y="644" width="300" height="92" rx="22" fill="#EEF9F2" filter="url(#shadow)"/>
  <text x="260" y="692" text-anchor="middle" class="box-title">会话上下文组装</text>
  <text x="260" y="723" text-anchor="middle" class="note">Transcript / Memory / SOUL</text>

  <rect x="110" y="756" width="300" height="72" rx="22" fill="#EAF4FF" filter="url(#shadow)"/>
  <text x="260" y="801" text-anchor="middle" class="box-title">LLM 网关</text>

  <path d="M440 725H500V857H540" class="arrow"/>

  <rect x="1160" y="600" width="360" height="280" rx="30" fill="#FFF7EE" stroke="#F0DFCD" stroke-width="2"/>
  <rect x="1190" y="572" width="158" height="42" rx="21" fill="#B8683D"/>
  <text x="1269" y="599" text-anchor="middle" class="section-tag">工具与策略支撑</text>

  <rect x="1190" y="644" width="300" height="116" rx="22" fill="#FFF1E1" filter="url(#shadow)"/>
  <text x="1340" y="694" text-anchor="middle" class="box-title">工具调度与策略</text>
  <text x="1340" y="718" text-anchor="middle" class="box-sub">OpenCrayToolDispatcher</text>
  <text x="1340" y="744" text-anchor="middle" class="box-sub">ToolPolicyPipeline</text>

  <rect x="1190" y="786" width="300" height="92" rx="22" fill="#FFF5E8" filter="url(#shadow)"/>
  <text x="1340" y="834" text-anchor="middle" class="box-title">受控工具执行</text>
  <text x="1340" y="860" text-anchor="middle" class="note">文件 / 命令 / Python / WebSearch</text>

  <path d="M1060 857H1120V702H1190" class="arrow"/>

  <rect x="180" y="1160" width="1240" height="150" rx="30" fill="#F5F8FB" stroke="#DCE5EC" stroke-width="2"/>
  <rect x="210" y="1132" width="178" height="42" rx="21" fill="#667C8D"/>
  <text x="299" y="1159" text-anchor="middle" class="section-tag">本地持久化与恢复</text>

  <rect x="230" y="1206" width="330" height="70" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="395" y="1249" text-anchor="middle" class="small">会话快照 / Prompt Checkpoint</text>

  <rect x="635" y="1206" width="250" height="70" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="760" y="1249" text-anchor="middle" class="small">Todo / 运行记录</text>

  <rect x="960" y="1206" width="410" height="70" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="1165" y="1249" text-anchor="middle" class="small">memory.json / SOUL.md / 其他本地状态</text>

  <path d="M800 1072V1160" class="arrow"/>
</svg>
